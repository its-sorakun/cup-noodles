<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cup Noodles — Media Server</title>
  <meta name="description" content="Personal homelab media server for browsing and streaming your media collection.">

  <!-- Favicon (emoji fallback) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🍜</text></svg>">

  <!-- TailwindCSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/style.css">

        <a href="#/" class="flex items-center gap-3 no-underline" id="nav-logo">

  <footer class="relative z-10 text-center py-6 px-4" style="color: var(--text-tertiary);">
    <p class="text-xs">🍜 Cup Noodles Media Server &nbsp;·&nbsp; localhost:1337</p>
