<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cup Noodles — Media Server</title>
  <meta name="description" content="Personal homelab media server for browsing and streaming your media collection.">

  <!-- Favicon (emoji fallback) -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🍜</text></svg>">

  <!-- Pre-compiled Tailwind Static CSS (zero runtime JS overhead, legacy friendly) -->
  <link rel="stylesheet" href="/tailwind.css">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/css/metadata.css">
</head>

<body class="font-sans">

  <!-- Animated Background Mesh -->
  <div class="bg-mesh"></div>
  <div class="bg-orb bg-orb--pink"></div>
  <div class="bg-orb bg-orb--teal"></div>

  <!-- Navigation -->
  <nav class="glass-nav" id="main-nav">
    <div class="w-full px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <!-- Logo -->
        <a href="#/" class="flex items-baseline gap-3 no-underline" id="nav-logo">
          <span class="text-2xl"
            style="font-family: 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Segoe UI Symbol', 'Android Emoji', 'EmojiSymbols';">🍜</span>
          <span class="flex items-baseline gap-2">
            <span class="text-base font-bold tracking-tight" style="color: var(--text-primary);">
              Cup Noodles
            </span>
            <span class="text-xs font-semibold opacity-50 tracking-widest hidden sm:inline-block">カップヌードル</span>
          </span>
        </a>

        <!-- Nav Links -->
        <div class="flex items-center gap-1 sm:gap-2" id="nav-links">
          <a href="#/" class="nav-link active" data-route="home" id="nav-home">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            Home
          </a>
          <a href="#/settings" class="nav-link" data-route="settings" id="nav-settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06-.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
              </path>
            </svg>
            Settings
          </a>
          <div class="w-px h-5 mx-1" style="background: var(--glass-border);"></div>
          <button
            class="nav-link cursor-pointer flex items-center gap-1.5 border-0 bg-transparent text-red-400 hover:text-red-300 transition-colors"
            id="logout-btn" title="Logout">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Logout
          </button>
          <button class="nav-link cursor-pointer flex items-center gap-1.5 border-0 bg-transparent"
            id="theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
            <!-- Populated by app.js -->
          </button>
          <div class="w-px h-5 mx-1" style="background: var(--glass-border);"></div>
          <button class="nav-link cursor-pointer flex items-center gap-1.5 border-0 bg-transparent"
            id="fullscreen-toggle-btn" title="Toggle Fullscreen" aria-label="Toggle Fullscreen">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3">
              </path>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="relative z-10 pt-24 pb-16 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto min-h-screen" id="app-content">
    <!-- SPA content rendered here by app.js -->
  </main>

  <!-- Footer -->
  <footer class="relative z-10 text-center py-6 px-4" style="color: var(--text-tertiary);">
    <p class="text-xs">🍜 Cup Noodles Media Server &nbsp;·&nbsp; localhost:1337</p>
  </footer>

  <!-- Polyfills removed for modern browser performance -->

  <!-- App Script -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script src="/js/utils.js?v=10"></script>
  <script src="/js/api.js?v=10"></script>
  <script src="/js/views.js?v=10"></script>
  <script src="/js/player.js?v=10"></script>
  <script src="/js/app.js?v=10"></script>
</body>

</html>
